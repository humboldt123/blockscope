data:
  n_train: 73
  vocab_path: /data/vvm33/pum_checkpoints/blocktype/vocab.json

model:
  backbone: google/siglip2-base-patch16-naflex
  feat_dim: 768
  xyz_dim: 3          # raw (x,y,z)/16 relative to player centre
  hidden_dim: 512
  dropout: 0.1
  n_classes: 91       # SCATTER_BLOCKS 0..90; OOV → ignore_index=-1

training:
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  epochs: 60

checkpointing:
  dir: /data/vvm33/pum_checkpoints/viblock2
  save_every_epochs: 5

wandb:
  project: pum
  entity: venusisntprofessional-drexel-university
  run_name: viblock2_run5
