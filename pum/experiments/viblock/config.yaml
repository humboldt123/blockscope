data:
  n_train: 73
  # Reuse the blocktype vocab (91 scatter classes); viblock adds sky as class 0.
  vocab_path: /data/vvm33/pum_checkpoints/blocktype/vocab.json

model:
  backbone: google/siglip2-base-patch16-naflex
  feat_dim: 768
  n_classes: 91   # 0..90=scatter blocks; sky+OOV ignored (ignore_index=-1)

training:
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  lr_warmup_epochs: 2

checkpointing:
  dir: /data/vvm33/pum_checkpoints/viblock
  save_every_epochs: 5

wandb:
  project: pum
  entity: venusisntprofessional-drexel-university
  run_name: viblock_run2
