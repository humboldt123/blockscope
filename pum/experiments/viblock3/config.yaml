data:
  n_train: 73
  vocab_path: /data/vvm33/pum_checkpoints/blocktype/vocab.json

model:
  backbone: google/siglip2-base-patch16-naflex
  feat_dim: 768
  d_model: 256
  n_ref: 4       # learned reference points per query per head
  n_heads: 8
  n_layers: 2

training:
  batch_size: 4
  weight_decay: 0.0001
  epochs: 50

checkpointing:
  dir: /data/vvm33/pum_checkpoints/viblock3
  save_every_epochs: 5

wandb:
  project: pum
  entity: venusisntprofessional-drexel-university
