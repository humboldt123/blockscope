#Blockscope Configuration - headless container
resolution_width=640
resolution_height=360
aspect_ratio_mode=preserve
target_fps=20
recording_directory=./recordings
show_chat_messages=true
show_recording_overlay=true
# Hopper runs on the Brev host; container uses --network host so localhost works.
server_url=http://localhost:9000
# ffmpeg is on PATH inside the container.
ffmpeg_path=ffmpeg
auto_reconnect=true
reconnect_delay_seconds=3
# Initial headless auto-connect target (env vars BLOCKSCOPE_AUTOCONNECT_HOST/PORT
# override these at runtime).
autoconnect_host=mc.vivime.info
autoconnect_port=25566
capture_nearby_entities=true
entity_capture_radius=16
capture_all_entities=true
capture_item_entities=true
capture_nearby_blocks=true
block_capture_radius=128
capture_block_entities=true
use_relative_block_positions=false
