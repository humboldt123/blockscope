[project]
name = "blockscope-pipeline"
version = "0.2.0"
description = "Blockscope pipeline — GPU-based Minecraft block visibility labeler."
requires-python = ">=3.12"
dependencies = [
    "moderngl>=5.12.0",
    "pygame>=2.6.1",
    "pyglm>=2.8.3",
    "av>=16.0.0",
    "numpy>=1.20",
    "pillow>=12.2.0",
    "platformdirs>=3.0",
    # amulet-nbt and minecraft-resource-pack are vendored in pipeline/vendor/
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = {where = [".."], include = ["pipeline", "pipeline.*"]}
