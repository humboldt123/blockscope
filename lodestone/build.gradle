plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.blockscope'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.19.4-R0.1-SNAPSHOT'
    // PacketEvents added when we wire up the real connection guard for production
}

shadowJar {
    archiveClassifier = ''
    // Nothing to shade yet — PacketEvents is compileOnly (plugin dep at runtime)
}

jar {
    manifest {
        attributes 'Main-Class': 'com.blockscope.lodestone.LodestonePlugin'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
